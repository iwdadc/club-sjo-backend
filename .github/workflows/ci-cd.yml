name: CI-CD Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/ci-cd.yml'
  
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/ci-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Si se hace push a la misma rama mientras hay un workflow en progreso, cancelarlo
  cancel-in-progress: ${{ github.ref_name != (vars.DEPLOY_BRANCH || 'main') }}

env:
  JAVA_VERSION: '21'
  SONAR_ORGANIZATION: iwdadc
  SONAR_PROJECT_KEY: iwdadc_club-sjo-backend

jobs:
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: club_sjo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/club_sjo?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: github-actions-test-secret-0123456789abcdef

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar tests y generar cobertura
        run: >
          mvn -B
          -Dtest='*Test,*Tests,*IT'
          org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent
          verify
          org.jacoco:jacoco-maven-plugin:0.8.13:report

      - name: Guardar resultados de los tests
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: backend/target/
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: test

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Descargar resultados de los tests
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: backend/target/

      - name: Ejecutar análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          '-Dsonar.coverage.exclusions=**/dto/**,**/entity/**,**/config/**,**/*Application.java'
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  version:
    name: Crear versión
    runs-on: ubuntu-latest
    needs: [test, sonar]

    if: github.event_name == 'push' && github.ref_name == (vars.DEPLOY_BRANCH || 'main') 

    permissions:
      contents: write

    outputs:
      version: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Descargar historial
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generar nueva versión
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: ${{ vars.DEPLOY_BRANCH || 'main' }}
          tag_prefix: v
          fetch_all_tags: true

      - name: Crear release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  deploy:
    name: Deploy en Render
    runs-on: ubuntu-latest
    needs: [test, sonar, version]

    if: github.event_name == 'push' && github.ref_name == (vars.DEPLOY_BRANCH || 'main')

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Iniciar deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"
      - name: Verificar que el commit nuevo esté en producción
        env:
          APP_URL: ${{ vars.APP_URL }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Esperando versión ${VERSION} (commit ${COMMIT_SHA})"

          for i in $(seq 1 40); do
            RESPUESTA=$(curl --silent --max-time 10 "${APP_URL%/}/health" || true)
            DESPLEGADO=$(echo "$RESPUESTA" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "Intento $i/40: ${RESPUESTA:-sin respuesta}"
            if [ "$DESPLEGADO" = "$COMMIT_SHA" ]; then
              echo "Backend funcionando correctamente"
              exit 0
            fi

            echo "Intento $i/40. Esperando 15 segundos..."
            sleep 15
          done

          echo "::error::El backend no informó el commit ${COMMIT_SHA} después de 10 minutos."
          exit 1